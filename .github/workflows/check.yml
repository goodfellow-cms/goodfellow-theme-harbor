name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true
      # Installs Goodfellow's packages to check the theme against, running none of their install scripts (.npmrc).
      - run: npm install --no-audit --no-fund
      - run: npm test
